name: Daily digest

on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC = 07:00 IST. Cron here is ALWAYS UTC.
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

# Lets the job push the updated seen.json back to the repo.
permissions:
  contents: write

# Never run two digests at once (a manual run during the scheduled one
# would both read the same seen.json and double-send).
concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        run: python digest.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save seen.json back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "Update seen.json"
          git push
